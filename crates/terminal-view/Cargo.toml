[package]
name = "taco-terminal-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[example]]
name = "look"
required-features = ["capture"]

[features]
# Drawing a terminal to an image needs gpui's test support, which a shipped build never carries.
capture = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
taco-protocol.workspace = true
taco-settings.workspace = true
taco-ghostty.workspace = true
taco-wire.workspace = true
futures.workspace = true
gpui.workspace = true

[dev-dependencies]
# Only the `look` example opens a platform.
gpui_platform.workspace = true

[package]
name = "taco-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "taco-shells"
path = "src/main.rs"

[[example]]
name = "render"
required-features = ["render"]

[features]
# Drawing the window to an image needs gpui's test support, which a shipped build never carries.
render = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "dep:serde_json",
    "dep:taco-workspace",
    "dep:taco-agents",
]
# The smoke tests' way into the running window. xtask never builds it into the stable app.
drive = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "dep:taco-drive",
    "dep:serde_json",
]

[dependencies]
taco-protocol.workspace = true
taco-rules.workspace = true
taco-settings.workspace = true
taco-services.workspace = true
taco-identity.workspace = true
taco-terminal-view.workspace = true
taco-host.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
libc.workspace = true
unicode-segmentation.workspace = true
chrono.workspace = true
taco-drive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
taco-workspace = { workspace = true, optional = true }
taco-agents = { workspace = true, optional = true }

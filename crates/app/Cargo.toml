[package]
name = "taco-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "taco-shells"
path = "src/main.rs"

[[example]]
name = "render"
required-features = ["render"]

[features]
# Drawing the window to an image needs gpui's test support, which a shipped build never carries.
render = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]
# The smoke tests' way into the running window. xtask never builds it into the stable app.
drive = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "dep:image",
    "dep:taco-drive",
    "dep:serde_json",
]

[dependencies]
taco-protocol.workspace = true
taco-rules.workspace = true
taco-agents.workspace = true
taco-workspace.workspace = true
taco-settings.workspace = true
taco-services.workspace = true
taco-terminal-view.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
crossbeam-channel.workspace = true
uuid.workspace = true
taco-wire.workspace = true
libc.workspace = true
image = { workspace = true, optional = true }
taco-drive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

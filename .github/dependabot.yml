version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # One pull request a week instead of fifteen. Majors are left ungrouped so
      # an Electron or vite jump arrives on its own and can be read on its own.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

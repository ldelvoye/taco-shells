# Checks the release page in apps/site. It ships nothing: the page is not
# deployed yet. The app's own workflow, main.yml, skips pushes that touch only
# the site.
name: site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/site

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lockfile resolves through Socket Firewall
        run: "! grep -nE '\"resolved\": \"https?://' package-lock.json | grep -v '\"resolved\": \"https://sfw.security.sentry.io/npm/'"

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

# Checks every pull request and every push to main. Each push to main is then released as a prerelease with no
# download. Making a release stable is `cargo xtask promote`, run on Lucas's machine rather than here; AGENTS.md,
# "Versions and releasing", has the whole picture.
name: main

on:
  pull_request:
    paths-ignore: &docs
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. On main a run waits for the one before it instead, so two
# releases never race on a tag; GitHub keeps only the newest waiting run, and the release reads every commit anyway.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # macOS because the app is macOS-only.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the version rust-toolchain.toml pins.
      - run: rustup toolchain install

      # Saved from main only: gpui makes each cache several GB, and caches saved from pull
      # requests would push main's out of the repo's 10 GB, leaving every check to build cold.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Ghostty's library, which crates/ghostty/build.rs fetches into TACO_GHOSTTY_DIR on a
      # miss. Keyed on build.rs, which pins it, so a new pin is a new cache.
      - run: echo "TACO_GHOSTTY_DIR=$RUNNER_TEMP/libghostty-vt" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/libghostty-vt
          key: libghostty-vt-${{ hashFiles('crates/ghostty/build.rs') }}

      - run: cargo fmt --all --check

      # A config folder name spelled by hand outside crates/identity would let one channel touch the other's folder,
      # and no binary scan can see it.
      - name: Config folder names come only from crates/identity
        run: "! git grep -n -E '\"\\.taco-shells(-dev)?\"' -- crates xtask smoke ':!crates/identity/src/lib.rs'"

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The code only tooling turns on: app's render and drive, terminal-view's capture, ghostty's bindings.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - run: cargo test --workspace --locked --no-run

      # The whole run is meant to stay under about 10 s once compiled. Twice that
      # fails, which catches a test that sleeps or starts something, not a slow runner.
      - name: cargo test, within 20 s
        run: |
          started=$(date +%s)
          cargo test --workspace --locked
          elapsed=$(( $(date +%s) - started ))
          echo "cargo test took ${elapsed} s once compiled." >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 20 ]; then
            echo "::error::cargo test took ${elapsed} s once compiled, over the 20 s budget."
            exit 1
          fi

      # Builds a development bundle and drives it. The runner has Metal, so the window draws.
      - run: cargo xtask smoke

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the tags and the notes read the log, so a shallow clone would get both wrong.
          fetch-depth: 0
          # Keeps the write token out of .git/config; the release step is handed it as GH_TOKEN.
          persist-credentials: false

      - run: rustup toolchain install

      - run: cargo xtask release
        env:
          GH_TOKEN: ${{ github.token }}

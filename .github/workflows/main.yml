# Verifies every push to main, then releases it as a prerelease carrying no
# download. Promoting one to stable is `npm run promote`, which runs on a machine
# rather than here. AGENTS.md, "Versions and releasing", has the whole picture.
name: main

on:
  push:
    branches: [main]
    # The release page is not part of the app: a push touching only it must not cut a version.
    paths-ignore:
      - "apps/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still running would race on the tag.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  verify:
    # macOS because the app is macOS-only: the e2e suite launches a real
    # Electron binary and the ptys it opens run login shells.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the tags and the notes read the log, so a
          # shallow clone would get both wrong.
          fetch-depth: 0
          # Keeps the write token out of .git/config, where install scripts and
          # tests could read it. The release step is handed it as GH_TOKEN.
          persist-credentials: false

      - name: Lockfile resolves through Socket Firewall
        run: "! grep -nE '\"resolved\": \"https?://' package-lock.json | grep -v '\"resolved\": \"https://sfw.security.sentry.io/npm/'"

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test

      # Builds and drives the real app. Nothing here packages a bundle, so this
      # needs neither electron-builder nor librsvg for the icon.
      - run: npm run e2e

      - run: node scripts/dev-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}

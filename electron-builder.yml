appId: com.ldelvoye.tacoshells
productName: Taco Shells

# The bundle is "Taco Shells.app", but a release asset named from productName
# reaches a download link as Taco%20Shells. Name artifacts from the package
# instead.
artifactName: ${name}-${version}-${arch}.${ext}

# Spotlight skips a directory named .noindex, so the build output does not show
# up as a second, staler Taco Shells beside the installed one.
directories:
  buildResources: build
  output: dist.noindex

files:
  - '!src'
  - '!docs'
  - '!branding'
  - '!electron.vite.config.ts'
  - '!vitest.config.ts'
  - '!tsconfig*.json'
  - '!electron-builder.yml'

# node-pty ships a native binding and a spawn-helper executable, neither of
# which macOS can load from inside an asar archive.
asarUnpack:
  - '**/node_modules/node-pty/**'

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  target:
    - target: dmg
      arch: arm64

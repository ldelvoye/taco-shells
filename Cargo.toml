[workspace]
resolver = "3"
members = ["crates/*", "xtask", "smoke"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
taco-protocol = { path = "crates/protocol" }
taco-rules = { path = "crates/rules" }
taco-agents = { path = "crates/agents" }
taco-workspace = { path = "crates/workspace" }
taco-settings = { path = "crates/settings" }
taco-services = { path = "crates/services" }
taco-terminal-view = { path = "crates/terminal-view" }
taco-wire = { path = "crates/wire" }
taco-drive = { path = "crates/drive" }
taco-ghostty = { path = "crates/ghostty" }

serde = { version = "1", features = ["derive"] }
# preserve_order: key bindings layer, and problems are listed, in the order the user's file has them.
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.34", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
notify = "9"
tempfile = "3"
bindgen = "0.72"

# gpui has no release newer than 2025-10, so both crates pin one zed revision; move them together.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a3ce8d5e88e35697b2ba1cf9cb3c6816089b8281" }
# font-kit: without it gpui draws no text. runtime_shaders: no Xcode `metal` compiler is needed.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a3ce8d5e88e35697b2ba1cf9cb3c6816089b8281", features = ["font-kit", "runtime_shaders"] }

# zed's own patch at the pinned revision; keep it in step with gpui.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }

# Debug info is most of a gpui build's size and link time; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

# At opt-level 0 gpui takes about 50 ms to draw a full screen of styled text, against 3 ms at 2.
[profile.dev.package."*"]
debug = false
opt-level = 2

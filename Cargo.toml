[workspace]
resolver = "3"
members = ["crates/*", "xtask", "smoke"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
taco-protocol = { path = "crates/protocol" }
taco-rules = { path = "crates/rules" }
taco-agents = { path = "crates/agents" }
taco-workspace = { path = "crates/workspace" }
taco-settings = { path = "crates/settings" }
taco-services = { path = "crates/services" }
taco-terminal-view = { path = "crates/terminal-view" }
taco-wire = { path = "crates/wire" }
taco-drive = { path = "crates/drive" }
taco-ghostty = { path = "crates/ghostty" }

serde = { version = "1", features = ["derive"] }
# preserve_order: key bindings layer, and problems are listed, in the order the user's file has them.
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.34", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
notify = "9"
tempfile = "3"
bindgen = "0.72"

# Debug info is most of a gpui build's size and link time; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

# At opt-level 0 gpui takes about 50 ms to draw a full screen of styled text, against 3 ms at 2.
[profile.dev.package."*"]
debug = false
opt-level = 2
